#
name: Build docs site

# Deploys the MkDocs site to GitHub Pages. Path-filtered like the image builds,
# so a docs typo does not rebuild containers and vice versa.
on:
  push:
    branches: ['main']
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yaml
  # Allows a manual redeploy without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs
        run: pip install mkdocs-material==9.5.49

      # --strict turns broken internal links and bad config into build
      # failures, so they surface here instead of on the published site.
      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
