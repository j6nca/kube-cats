<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img">
  <title>on fire</title>
  <!--
    Three-frame pixel flame. Each frame is visible for a third of the cycle and
    the delays are offset by a third, so exactly one is ever showing. Frames
    start at opacity 0 so nothing double-exposes during the delay.
  -->
  <style>
    .f { opacity: 0; animation: flick 0.36s steps(1, end) infinite; }
    #f2 { animation-delay: 0.12s; }
    #f3 { animation-delay: 0.24s; }
    @keyframes flick {
      0%, 33.32% { opacity: 1; }
      33.33%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .f { animation: none; }
      #f1 { opacity: 1; }
    }
  </style>

  <g class="f" id="f1">
    <g fill="#ff7518">
      <rect x="8" y="1" width="1" height="1"/>
      <rect x="7" y="2" width="2" height="1"/>
      <rect x="7" y="3" width="3" height="1"/>
      <rect x="6" y="4" width="4" height="2"/>
      <rect x="5" y="6" width="6" height="2"/>
      <rect x="4" y="8" width="8" height="3"/>
      <rect x="5" y="11" width="6" height="2"/>
    </g>
    <g fill="#ffc93c">
      <rect x="7" y="6" width="2" height="1"/>
      <rect x="6" y="8" width="4" height="3"/>
      <rect x="7" y="11" width="2" height="1"/>
    </g>
    <rect x="7" y="9" width="2" height="2" fill="#fff3b0"/>
  </g>

  <g class="f" id="f2">
    <g fill="#ff7518">
      <rect x="7" y="2" width="1" height="1"/>
      <rect x="7" y="3" width="2" height="1"/>
      <rect x="6" y="4" width="3" height="1"/>
      <rect x="6" y="5" width="4" height="2"/>
      <rect x="5" y="7" width="6" height="2"/>
      <rect x="4" y="9" width="8" height="2"/>
      <rect x="5" y="11" width="6" height="2"/>
    </g>
    <g fill="#ffc93c">
      <rect x="6" y="7" width="3" height="1"/>
      <rect x="6" y="8" width="4" height="3"/>
      <rect x="7" y="11" width="2" height="1"/>
    </g>
    <rect x="7" y="9" width="2" height="2" fill="#fff3b0"/>
  </g>

  <g class="f" id="f3">
    <g fill="#ff7518">
      <rect x="9" y="1" width="1" height="1"/>
      <rect x="8" y="2" width="2" height="1"/>
      <rect x="7" y="3" width="3" height="1"/>
      <rect x="6" y="4" width="4" height="2"/>
      <rect x="5" y="6" width="6" height="2"/>
      <rect x="4" y="8" width="8" height="3"/>
      <rect x="4" y="11" width="7" height="2"/>
    </g>
    <g fill="#ffc93c">
      <rect x="7" y="6" width="2" height="1"/>
      <rect x="6" y="8" width="4" height="3"/>
      <rect x="6" y="11" width="3" height="1"/>
    </g>
    <rect x="7" y="9" width="2" height="2" fill="#fff3b0"/>
  </g>
</svg>
